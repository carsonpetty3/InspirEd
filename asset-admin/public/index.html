<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Library — Upload</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f5f7;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* Nav (matches browse.html) */
    .nav {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 0 32px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .nav-brand { font-size: 16px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 8px; }
    .nav-links  { display: flex; gap: 8px; }
    .nav-link {
      padding: 6px 14px; border-radius: 6px; font-size: 14px;
      font-weight: 500; text-decoration: none; color: #6b7280;
      transition: all .15s;
    }
    .nav-link:hover   { background: #f3f4f6; color: #111827; }
    .nav-link.active  { background: #eff6ff; color: #2563eb; }

    .app { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }

    /* Progress bar */
    .progress-wrap { margin-bottom: 32px; }
    .progress-steps { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .progress-step {
      font-size: 11px; font-weight: 600; color: #9ca3af;
      text-transform: uppercase; letter-spacing: .5px;
      cursor: pointer; transition: color .2s;
    }
    .progress-step.active  { color: #2563eb; }
    .progress-step.done    { color: #16a34a; }
    .progress-track { height: 4px; background: #e5e7eb; border-radius: 2px; }
    .progress-fill  { height: 4px; background: #2563eb; border-radius: 2px; transition: width .4s; }

    /* Card */
    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 32px;
    }
    .card-header { margin-bottom: 28px; }
    .card-header h2 { font-size: 20px; font-weight: 600; }
    .card-header p  { font-size: 14px; color: #6b7280; margin-top: 4px; }

    /* Warning banner */
    .banner-warning {
      background: #fef3c7; border: 1px solid #f59e0b;
      border-radius: 8px; padding: 14px 16px;
      font-size: 13px; color: #92400e;
      margin-bottom: 24px; line-height: 1.5;
    }
    .banner-warning strong { display: block; margin-bottom: 4px; font-size: 14px; }

    .banner-info {
      background: #eff6ff; border: 1px solid #93c5fd;
      border-radius: 8px; padding: 14px 16px;
      font-size: 13px; color: #1e3a8a;
      margin-bottom: 24px; line-height: 1.5;
    }
    .banner-info strong { display: block; margin-bottom: 6px; font-size: 14px; color: #1e40af; }
    .banner-info ul { margin: 6px 0 0 18px; max-height: 160px; overflow-y: auto; }
    .banner-info .banner-actions { margin-top: 10px; }

    /* Field groups */
    .field { margin-bottom: 22px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field-row .field { margin-bottom: 0; }

    label {
      display: block; font-size: 13px; font-weight: 600;
      color: #374151; margin-bottom: 5px;
    }
    label .req { color: #ef4444; margin-left: 2px; }
    label .badge {
      font-size: 10px; font-weight: 600; padding: 1px 6px;
      border-radius: 10px; margin-left: 6px; vertical-align: middle;
    }
    .badge-auto { background: #dbeafe; color: #1d4ed8; }
    .badge-cond { background: #fce7f3; color: #9d174d; }

    .helper { font-size: 12px; color: #6b7280; margin-top: 4px; line-height: 1.4; }

    input[type=text], input[type=number], textarea, select {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid #d1d5db; border-radius: 7px;
      font-size: 14px; color: #111827;
      background: #fff; transition: border-color .15s;
      appearance: none;
    }
    input[type=text]:focus, input[type=number]:focus,
    textarea:focus, select:focus {
      outline: none; border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    input.readonly {
      background: #f9fafb; color: #6b7280;
      border-style: dashed; cursor: not-allowed;
    }
    textarea { resize: vertical; min-height: 80px; }

    /* File picker */
    .file-area {
      border: 2px dashed #d1d5db; border-radius: 8px;
      padding: 24px; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .file-area:hover { border-color: #2563eb; background: #eff6ff; }
    .file-area input { display: none; }
    .file-area .file-icon { font-size: 28px; margin-bottom: 6px; }
    .file-area .file-label { font-size: 14px; color: #374151; font-weight: 500; }
    .file-area .file-sub   { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .file-chosen { font-size: 13px; color: #16a34a; margin-top: 8px; font-weight: 500; }

    /* Toggle */
    .toggle-wrap { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    .toggle {
      position: relative; width: 42px; height: 24px;
      background: #d1d5db; border-radius: 12px;
      cursor: pointer; transition: background .2s; flex-shrink: 0;
    }
    .toggle.on { background: #2563eb; }
    .toggle::after {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px;
      transition: transform .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle.on::after { transform: translateX(18px); }
    .toggle-label { font-size: 14px; color: #374151; }

    /* Chips / multi-select */
    .chips-wrap {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 8px; border: 1.5px solid #d1d5db;
      border-radius: 7px; min-height: 44px;
      background: #fff; cursor: default;
    }
    .chips-wrap:focus-within { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .chip {
      padding: 4px 10px; border-radius: 20px;
      font-size: 13px; cursor: pointer; user-select: none;
      border: 1.5px solid #d1d5db; background: #f9fafb;
      color: #374151; transition: all .15s;
    }
    .chip.selected {
      background: #2563eb; border-color: #2563eb;
      color: #fff; font-weight: 500;
    }
    .chip.warn.selected { background: #dc2626; border-color: #dc2626; }

    /* Tag input */
    .tag-input-wrap {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 6px 8px; border: 1.5px solid #d1d5db;
      border-radius: 7px; min-height: 44px;
      background: #fff; align-items: center;
      cursor: text;
    }
    .tag-input-wrap:focus-within { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .tag {
      display: flex; align-items: center; gap: 4px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      color: #1d4ed8; border-radius: 4px;
      padding: 2px 8px; font-size: 13px;
    }
    .tag.warn-tag {
      background: #fef2f2; border-color: #fecaca; color: #991b1b;
    }
    .tag button {
      background: none; border: none; cursor: pointer;
      color: inherit; font-size: 14px; padding: 0;
      line-height: 1; opacity: .7;
    }
    .tag button:hover { opacity: 1; }
    .tag-input-wrap input {
      border: none; outline: none; font-size: 13px;
      padding: 2px 4px; flex: 1; min-width: 120px;
      background: transparent; box-shadow: none;
    }

    /* Typeahead */
    .typeahead-wrap { position: relative; }
    .typeahead-results {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1.5px solid #d1d5db;
      border-radius: 7px; box-shadow: 0 4px 12px rgba(0,0,0,.1);
      z-index: 100; max-height: 200px; overflow-y: auto;
      display: none;

    .typeahead-results.open { display: block; }
    .typeahead-item {
      padding: 9px 12px; font-size: 13px; cursor: pointer;
      border-bottom: 1px solid #f3f4f6; color: #111827;
    }
    .typeahead-item:hover { background: #eff6ff; }
    .typeahead-item:last-child { border-bottom: none; }
    .typeahead-item small { color: #6b7280; margin-left: 6px; }
    .selected-assets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    /* Checkboxes */
    .checkbox-grid { display: flex; flex-direction: column; gap: 8px; }
    .checkbox-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .checkbox-item input { width: 16px; height: 16px; margin-top: 2px; cursor: pointer; accent-color: #2563eb; }
    .checkbox-item .cb-label { font-size: 14px; color: #374151; }
    .checkbox-item .cb-desc  { font-size: 12px; color: #6b7280; }

    /* Read-only display */
    .read-only-display {
      padding: 9px 12px; background: #f9fafb;
      border: 1.5px dashed #d1d5db; border-radius: 7px;
      font-size: 14px; color: #6b7280; min-height: 40px;
      font-family: 'SF Mono', 'Fira Code', monospace; letter-spacing: .3px;
    }

    /* Validation messages */
    .field-error { font-size: 12px; color: #dc2626; margin-top: 4px; display: none; }
    .field-error.show { display: block; }
    .field-warn  { font-size: 12px; color: #d97706; margin-top: 4px; display: none; }
    .field-warn.show  { display: block; }

    /* Alert */
    .alert {
      padding: 14px 16px; border-radius: 8px;
      font-size: 13px; margin-bottom: 20px;
      line-height: 1.5; display: none;
    }
    .alert.show { display: block; }
    .alert-error   { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .alert-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }

    /* Review screen */
    .review-section { margin-bottom: 24px; }
    .review-section h3 {
      font-size: 14px; font-weight: 600; color: #374151;
      border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 12px;
    }
    .review-grid { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; }
    .review-key { font-size: 13px; color: #6b7280; font-weight: 500; }
    .review-val { font-size: 13px; color: #111827; }
    .review-warn {
      background: #fffbeb; border: 1px solid #f59e0b;
      border-radius: 6px; padding: 10px 12px;
      font-size: 13px; color: #92400e; margin-bottom: 12px;
    }

    /* Prev / Next row inside wizard cards (class name avoids clashing with site header .nav) */
    .wizard-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
    .btn {
      padding: 10px 24px; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; border: none; transition: all .15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f3f4f6; color: #374151; border: 1.5px solid #e5e7eb; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Success screen */
    .success-screen { text-align: center; padding: 40px 0; }
    .success-screen .check { font-size: 56px; margin-bottom: 16px; }
    .success-screen h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .success-screen p  { color: #6b7280; font-size: 15px; }
    .success-screen .asset-id-display {
      font-family: monospace; font-size: 20px; font-weight: 700;
      color: #2563eb; background: #eff6ff;
      padding: 10px 20px; border-radius: 8px;
      display: inline-block; margin: 16px 0;
    }

    .hidden { display: none !important; }
  </style>
</head>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {

  metadataImportReport: null, // { unknownPaths, skippedValues, unresolvedRefs, dismissed }
  metadataJsonFileName: null,
}

// ─── Step definitions ─────────────────────────────────────────────────────────
const STEPS = [
  { id: 'basics',       label: 'Basics' },
  { id: 'classify',     label: 'Classification' },
  { id: 'pathway',      label: 'Pathway' },
  { id: 'audience',     label: 'Audience' },
  { id: 'adaptive',     label: 'Adaptive' },
  { id: 'psychosocial', label: 'Psychosocial' },

// ─── Metadata JSON import (client-side; not posted to server) ────────────────
// Paths listed in METADATA_IGNORE_PATHS are accepted and omitted from “unknown”
// (e.g. asset_id / file_path are set by the app on upload, not the wizard).
const METADATA_IGNORE_PATHS = new Set([
  'asset_id', 'created_at', 'updated_at', 'schema_version', '_id',
  'identification.file_path',
  'identification.date_created',
  'transcript_available',
  'identification.transcript_available',

const METADATA_ENUMS = {

  concept_domain: ['lung_biology','genetics','treatment','diagnosis','home_care','psychosocial'],
  disease_relevance_tags: ['SFTPC mutation','SFTPB deficiency','ABCA3 deficiency','general chILD'],
  explanation_role: ['definition','mechanism','analogy','visual_example','clinical_application','summary','follow_up'],

  medical_terminology_level: ['none','minimal','moderate','clinical'],

  stress_state_compatibility: ['baseline_calm','mild_concern','moderate_stress','acute_crisis','post_bad_news','post_hospitalization'],

  care_journey_stage: ['pre_diagnosis','diagnosis','acute_management','home_management','advanced_planning'],
  cognitive_load_rating: ['low','medium','high'],
  element_interactivity: ['low','medium','high'],
  emotional_tone: ['reassuring','matter_of_fact','empowering','cautionary','validating'],
  emotional_sensitivity_level: ['low','medium','high','critical'],
  intent_type: ['explain','reassure','define','compare','decide','procedure_how_to','prognosis'],

}

const METADATA_PATH_ALIASES = {

  'identification.content_type': 'content_type',
  'identification.module_id': 'module_id',
  'identification.lesson_id': 'lesson_id',
  'identification.author_source': 'author_source',
  'identification.version': 'version',
  'identification.clinical_reviewed': 'clinical_reviewed',
  'concept_graph.primary_concept': 'primary_concept',
  'concept_graph.secondary_concepts': 'secondary_concepts',
  'concept_graph.prerequisite_concept_ids': 'prerequisite_concept_ids',
  'concept_graph.next_concept_ids': 'next_concept_ids',
  'concept_graph.disease_relevance_tags': 'disease_relevance_tags',
  'concept_graph.concept_domain': 'concept_domain',
  'concept_graph.explains_symptom': 'explains_symptom',
  'concept_graph.explains_procedure': 'explains_procedure',
  'audience.target_audience': 'target_audience',
  'audience.reading_level_grade': 'reading_level_grade',
  'audience.health_literacy_level': 'health_literacy_level',

  'accessibility.closed_captions': 'closed_captions',

}

const METADATA_TOPLEVEL_WIZARD_KEYS = new Set([
  'title','content_type','module_id','lesson_id','author_source','version',
  'clinical_reviewed','plain_language_version','language_versions',
  'disease_relevance_tags','concept_domain','primary_concept','secondary_concepts',

function normalizeMetadataLeaf(v) {
  if (v === null || v === undefined) return null
  if (typeof v === 'object' && !Array.isArray(v)) {
    if ('$date' in v) {
      const d = v.$date
      if (typeof d === 'string') return d
      if (typeof d === 'number') return new Date(d).toISOString()
      return null
    }
    if ('$oid' in v) return String(v.$oid)
  }
  return v
}

function normalizeMetadataDeep(v) {
  if (v === null || v === undefined) return null
  if (Array.isArray(v)) return v.map(normalizeMetadataDeep)
  const n = normalizeMetadataLeaf(v)
  if (n !== v && typeof v === 'object' && !Array.isArray(v)) return n
  return v
}

function flattenMetadataLeaves(obj, prefix = '') {
  const out = new Map()
  function walk(o, p) {
    if (o === null || o === undefined) {
      out.set(p, null)
      return
    }
    if (typeof o === 'object' && !Array.isArray(o) && o !== null) {
      if ('$date' in o || '$oid' in o) {
        out.set(p, normalizeMetadataLeaf(o))
        return
      }
    }
    if (Array.isArray(o)) {
      out.set(p, normalizeMetadataDeep(o))
      return
    }
    if (typeof o !== 'object') {
      out.set(p, o)
      return
    }
    const keys = Object.keys(o)
    if (keys.length === 0) return
    for (const k of keys) {
      const path = p ? `${p}.${k}` : k
      const child = o[k]
      if (child === null || child === undefined) {
        out.set(path, null)
      } else if (typeof child === 'object' && !Array.isArray(child) && child !== null) {
        if ('$date' in child || '$oid' in child) {
          out.set(path, normalizeMetadataLeaf(child))
        } else {
          walk(child, path)
        }
      } else if (Array.isArray(child)) {
        out.set(path, normalizeMetadataDeep(child))
      } else {
        out.set(path, child)
      }
    }
  }
  walk(obj, prefix)
  return out
}

function coerceBool(v) {
  if (v === null || v === undefined) return null
  if (typeof v === 'boolean') return v
  if (v === 'true' || v === '1') return true
  if (v === 'false' || v === '0') return false
  return null
}

function mergeMetadataField(field, raw, skippedValues) {
  if (raw === null || raw === undefined) return false

  const boolFields = new Set([
    'clinical_reviewed','plain_language_version','can_stand_alone',
    'includes_reassurance','addresses_guilt_or_blame','decision_support_context',
    'isolation_acknowledgment','audio_narration','screen_reader_compatible',
    'mobile_optimized','closed_captions',
  ])
  if (boolFields.has(field)) {
    const b = coerceBool(raw)
    if (b === null) return false
    state.data[field] = b
    return true
  }

  if (field === 'module_id') {
    const n = parseInt(raw, 10)
    if (!Number.isFinite(n) || n < 1 || n > 99) {
      skippedValues.push(`${field}: ${JSON.stringify(raw)}`)
      return true
    }
    state.data[field] = n
    return true
  }

  if (field === 'sequence_position' || field === 'reading_level_grade') {
    const n = parseInt(raw, 10)
    if (!Number.isFinite(n)) {
      skippedValues.push(`${field}: ${JSON.stringify(raw)}`)
      return true
    }
    if (field === 'reading_level_grade' && (n < 1 || n > 16)) {
      skippedValues.push(`${field}: ${n} (expected 1–16)`)
      return true
    }
    if (field === 'sequence_position' && n < 1) {
      skippedValues.push(`${field}: ${n}`)
      return true
    }
    state.data[field] = n
    return true
  }

  if (field === 'lesson_id' || field === 'title' || field === 'author_source' ||
      field === 'version' || field === 'learning_objective' || field === 'just_in_time_trigger' ||
      field === 'primary_concept' || field === 'alt_text') {
    state.data[field] = String(raw).trim()
    return true
  }

  const arrayStringFields = new Set([
    'secondary_concepts','explains_symptom','explains_procedure','appropriate_after_event',
    'contraindicated_after_event','parent_question_patterns','query_synonyms','keyword_triggers',
  ])
  if (arrayStringFields.has(field)) {
    const arr = Array.isArray(raw) ? raw : [raw]
    state.data[field] = arr.map(x => String(x).trim()).filter(Boolean)
    return true
  }

  const enumArrayFields = new Set([
    'language_versions','disease_relevance_tags','instructional_strategy','target_audience',
    'stress_state_compatibility','parent_expertise_stage','care_journey_stage',
  ])
  if (enumArrayFields.has(field)) {
    const allowed = new Set(METADATA_ENUMS[field] || [])
    const arr = Array.isArray(raw) ? raw : [raw]
    const kept = []
    for (const x of arr) {
      const s = String(x).trim()
      if (!s) continue
      if (allowed.has(s)) kept.push(s)
      else skippedValues.push(`${field}: ${s}`)
    }
    if (kept.length) state.data[field] = kept
    return true
  }

  if (METADATA_ENUMS[field]) {
    const s = String(raw).trim()
    if (!METADATA_ENUMS[field].includes(s)) {
      skippedValues.push(`${field}: ${s}`)
      return true
    }
    state.data[field] = s
    return true
  }

  if (field === 'prerequisite_concept_ids' || field === 'next_concept_ids') {
    const arr = Array.isArray(raw) ? raw : [raw]
    state.data[field] = arr.map(x => {
      if (typeof x === 'object' && x && '$oid' in x) return String(x.$oid)
      return String(x).trim()
    }).filter(Boolean)
    return true
  }

  return false
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
}

function resolveMetadataRefArrays(unresolvedRefs) {
  const fields = ['prerequisite_concept_ids', 'next_concept_ids']
  for (const f of fields) {
    const arr = state.data[f]
    if (!Array.isArray(arr) || !arr.length) continue
    const out = []
    for (const item of arr) {
      const s = String(item).trim()
      if (!s) continue
      if (/^[a-fA-F0-9]{24}$/.test(s)) {
        out.push(s)
        continue
      }
      const found = state.allAssets.find(a => a.asset_id === s)
      if (found) out.push(String(found._id))
      else unresolvedRefs.push(`${f}: ${s}`)
    }
    state.data[f] = out
  }
}

function renderMetadataImportBanner() {
  const rep = state.metadataImportReport
  if (!rep || rep.dismissed) return ''
  const parts = []
  if (rep.unknownPaths?.length) {
    parts.push(`<strong>JSON paths not used by this wizard</strong><ul>${rep.unknownPaths.map(p => `<li><code>${escapeHtml(p)}</code></li>`).join('')}</ul>`)
  }
  if (rep.skippedValues?.length) {
    parts.push(`<strong>Values skipped (invalid or not allowed)</strong><ul>${rep.skippedValues.map(p => `<li><code>${escapeHtml(p)}</code></li>`).join('')}</ul>`)
  }
  if (rep.unresolvedRefs?.length) {
    parts.push(`<strong>References not linked (no matching asset in library)</strong><ul>${rep.unresolvedRefs.map(p => `<li><code>${escapeHtml(p)}</code></li>`).join('')}</ul>`)
  }
  if (!parts.length) return ''
  return `<div class="banner-info" id="metadataImportBanner">
    ${parts.join('')}
    <div class="banner-actions">
      <button type="button" class="btn btn-secondary" onclick="dismissMetadataImportBanner()">Dismiss</button>
    </div>
  </div>`
}

function dismissMetadataImportBanner() {
  if (state.metadataImportReport) state.metadataImportReport.dismissed = true
  renderStep(state.currentStep)
}

function applyMetadataJson(parsed) {
  const flat = flattenMetadataLeaves(parsed)
  const consumed = new Set()
  for (const p of METADATA_IGNORE_PATHS) {
    if (flat.has(p)) consumed.add(p)
  }

  const skippedValues = []
  const unresolvedRefs = []

  function take(path, field) {
    if (!flat.has(path)) return
    const raw = flat.get(path)
    consumed.add(path)
    mergeMetadataField(field, raw, skippedValues)
  }

  for (const [path, field] of Object.entries(METADATA_PATH_ALIASES)) {
    take(path, field)
  }

  for (const [path, val] of flat.entries()) {
    if (consumed.has(path)) continue
    if (!path.includes('.') && METADATA_TOPLEVEL_WIZARD_KEYS.has(path)) {
      consumed.add(path)
      mergeMetadataField(path, val, skippedValues)
    }
  }

  resolveMetadataRefArrays(unresolvedRefs)

  const unknownPaths = []
  for (const path of flat.keys()) {
    if (consumed.has(path)) continue
    unknownPaths.push(path)
  }
  unknownPaths.sort()

  if (!unknownPaths.length && !skippedValues.length && !unresolvedRefs.length) {
    state.metadataImportReport = null
  } else {
    state.metadataImportReport = {
      unknownPaths,
      skippedValues,
      unresolvedRefs,
      dismissed: false,
    }
  }
}

async function handleMetadataJsonSelect(input) {
  const file = input.files && input.files[0]
  if (!file) return
  hideAlert()
  const reader = new FileReader()
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result)
      await loadAssets()
      applyMetadataJson(parsed)
      state.metadataJsonFileName = file.name
      renderStep(state.currentStep)
      updateAssetIdPreview()
      handleConditionals()
    } catch (e) {
      showAlert('Metadata JSON: ' + (e instanceof SyntaxError ? 'invalid JSON — ' + e.message : e.message))
      input.value = ''
      state.metadataJsonFileName = null
      renderStep(state.currentStep)
    }
  }
  reader.readAsText(file)
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function el(id) { return document.getElementById(id) }

function showAlert(msg) {
  const a = el('globalAlert')
  a.textContent = msg
  a.classList.add('show')
  a.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}
function hideAlert() { el('globalAlert').classList.remove('show') }

function setToggle(id, val) {
  const t = el('toggle_' + id)
  if (!t) return
  if (val) t.classList.add('on'); else t.classList.remove('on')
  state.data[id] = val
}

function makeToggle(fieldId, required) {
  const val = state.data[fieldId] ?? false
  return `
    <div class="toggle-wrap">
      <div class="toggle ${val ? 'on' : ''}" id="toggle_${fieldId}"
        onclick="toggleField('${fieldId}')"></div>
      <span class="toggle-label" id="toggleLabel_${fieldId}">${val ? 'Yes' : 'No'}</span>
    </div>`
}

function toggleField(id) {
  const t = el('toggle_' + id)
  const val = !t.classList.contains('on')
  setToggle(id, val)
  el('toggleLabel_' + id).textContent = val ? 'Yes' : 'No'
  handleConditionals()
}

function makeChips(fieldId, options, warnValues = []) {
  const selected = state.data[fieldId] || []
  return `<div class="chips-wrap" id="chips_${fieldId}">
    ${options.map(o => {
      const isWarn = warnValues.includes(o.value || o)
      const val = o.value || o
      const label = o.label || o
      const isSelected = selected.includes(val)
      return `<div class="chip ${isSelected ? 'selected' : ''} ${isWarn && isSelected ? 'warn' : ''}"
        data-val="${val}" onclick="toggleChip('${fieldId}', this, ${isWarn})">${label}</div>`
    }).join('')}
  </div>`
}

function toggleChip(fieldId, chipEl, isWarn) {
  const val = chipEl.dataset.val
  let arr = state.data[fieldId] || []
  if (arr.includes(val)) {
    arr = arr.filter(v => v !== val)
    chipEl.classList.remove('selected', 'warn')
  } else {
    arr.push(val)
    chipEl.classList.add('selected')
    if (isWarn) chipEl.classList.add('warn')
  }
  state.data[fieldId] = arr
  handleConditionals()
  checkHighLoadWarning()
}

function makeTagInput(fieldId, placeholder, warnStyle = false) {
  const tags = state.data[fieldId] || []
  return `
    <div class="tag-input-wrap" id="tagwrap_${fieldId}" onclick="el('taginput_${fieldId}').focus()">
      <div id="tags_${fieldId}" style="display:contents">
        ${tags.map(t => renderTag(fieldId, t, warnStyle)).join('')}
      </div>
      <input id="taginput_${fieldId}" type="text" placeholder="${placeholder}"
        onkeydown="handleTagKey(event, '${fieldId}', ${warnStyle})">
    </div>`
}

function renderTag(fieldId, val, warnStyle = false) {
  return `<span class="tag ${warnStyle ? 'warn-tag' : ''}">${val}
    <button type="button" onclick="removeTag('${fieldId}', '${val.replace(/'/g, "\\'")}')">×</button>
  </span>`
}

function handleTagKey(e, fieldId, warnStyle) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault()
    const val = e.target.value.trim().replace(/,$/, '')
    if (!val) return
    let arr = state.data[fieldId] || []
    if (!arr.includes(val)) {
      arr.push(val)
      state.data[fieldId] = arr
      el('tags_' + fieldId).insertAdjacentHTML('beforeend', renderTag(fieldId, val, warnStyle))
    }
    e.target.value = ''
  }
}

function removeTag(fieldId, val) {
  state.data[fieldId] = (state.data[fieldId] || []).filter(v => v !== val)
  renderStep(state.currentStep)
}

function makeTypeahead(fieldId, placeholder) {
  const selected = state.data[fieldId] || []
  return `
    <div class="typeahead-wrap">
      <input type="text" id="tainput_${fieldId}" placeholder="${placeholder}"
        oninput="searchAssets('${fieldId}', this.value)"
        onfocus="searchAssets('${fieldId}', this.value)"
        onblur="setTimeout(() => closeTypeahead('${fieldId}'), 200)">
      <div class="typeahead-results" id="taresults_${fieldId}"></div>
    </div>
    <div class="selected-assets" id="taselected_${fieldId}">
      ${selected.map(id => {
        const a = state.allAssets.find(x => x._id === id)
        return a ? renderTag(fieldId, a.title || a.asset_id) : ''
      }).join('')}
    </div>`
}

function searchAssets(fieldId, query) {
  const res = el('taresults_' + fieldId)
  const filtered = state.allAssets.filter(a =>
    !query ||
    (a.title && a.title.toLowerCase().includes(query.toLowerCase())) ||
    (a.asset_id && a.asset_id.toLowerCase().includes(query.toLowerCase()))
  ).slice(0, 8)

  if (!filtered.length) { res.classList.remove('open'); return }
  res.innerHTML = filtered.map(a =>
    `<div class="typeahead-item" onmousedown="selectAsset('${fieldId}', '${a._id}', '${(a.title || a.asset_id).replace(/'/g, "\\'")}')">
      ${a.title || '(no title)'} <small>${a.asset_id || ''}</small>
    </div>`
  ).join('')
  res.classList.add('open')
}

function selectAsset(fieldId, id, title) {
  let arr = state.data[fieldId] || []
  if (!arr.includes(id)) {
    arr.push(id)
    state.data[fieldId] = arr
    const wrap = el('taselected_' + fieldId)
    wrap.insertAdjacentHTML('beforeend', renderTag(fieldId, title))
  }
  el('tainput_' + fieldId).value = ''
  closeTypeahead(fieldId)
}

function closeTypeahead(fieldId) {
  const r = el('taresults_' + fieldId)
  if (r) r.classList.remove('open')
}

function checkboxGrid(fieldId, options) {
  const selected = state.data[fieldId] || []
  return `<div class="checkbox-grid">
    ${options.map(o => `
      <label class="checkbox-item">
        <input type="checkbox" value="${o.value}" ${selected.includes(o.value) ? 'checked' : ''}
          onchange="toggleCheckbox('${fieldId}', '${o.value}', this.checked)">
        <div>
          <div class="cb-label">${o.label}</div>
          ${o.desc ? `<div class="cb-desc">${o.desc}</div>` : ''}
        </div>
      </label>`).join('')}
  </div>`
}

function toggleCheckbox(fieldId, val, checked) {
  let arr = state.data[fieldId] || []
  if (checked) { if (!arr.includes(val)) arr.push(val) }
  else { arr = arr.filter(v => v !== val) }
  state.data[fieldId] = arr
  handleConditionals()
}

function getVal(fieldId) {
  const el2 = document.querySelector(`[name="${fieldId}"]`)
  return el2 ? el2.value : (state.data[fieldId] ?? '')
}

function saveInputs() {
  document.querySelectorAll('input[name], select[name], textarea[name]').forEach(el2 => {
    if (el2.type === 'checkbox') return
    state.data[el2.name] = el2.value
  })
}

// ─── Conditional visibility ───────────────────────────────────────────────────
function handleConditionals() {
  saveInputs()
  const ct = state.data.content_type || ''

  // Closed captions — only for video/audio types
  const ccRow = el('row_closed_captions')
  if (ccRow) {
    const show = ['video_segment','animation','procedural_demo'].includes(ct)
    ccRow.classList.toggle('hidden', !show)
  }

  // Alt text — only for visual types
  const altRow = el('row_alt_text')
  if (altRow) {
    const show = ['diagram','animation'].includes(ct)
    altRow.classList.toggle('hidden', !show)
  }

  // Prerequisite search — only if can_stand_alone = false
  const prereqRow = el('row_prerequisite')
  if (prereqRow) {
    const show = state.data.can_stand_alone === false
    prereqRow.classList.toggle('hidden', !show)
  }

  // asset_id preview
  updateAssetIdPreview()
}

function updateAssetIdPreview() {
  const preview = el('asset_id_preview')
  if (!preview) return
  const abbrev = {
    animation:'ANI', video_segment:'VID', diagram:'DIA',
    text_explanation:'TXT', analogy:'ANA', glossary_entry:'GLS',
    case_example:'CAS', procedural_demo:'PRO'
  }
  const ct  = state.data.content_type || ''
  const mod = state.data.module_id || ''
  const les = (state.data.lesson_id || '').replace('.','')
  if (ct && mod && les) {
    const type = abbrev[ct] || '???'
    preview.textContent = `${type}_M${String(mod).padStart(2,'0')}_L${les}_NNN`
  } else {
    preview.textContent = 'Fill in module, lesson and content type above'
  }
}

function checkHighLoadWarning() {
  const warn = el('highLoadWarn')
  if (!warn) return
  const load   = state.data.cognitive_load_rating
  const states = state.data.stress_state_compatibility || []
  const bad    = states.some(s => ['acute_crisis','post_bad_news'].includes(s))
  if (load === 'high' && bad) {
    warn.classList.add('show')
  } else {
    warn.classList.remove('show')
  }
}

// ─── Progress bar ──────────────────────────────────────────────────────────────
function updateProgress() {
  const steps = el('progressSteps')
  const fill  = el('progressFill')
  steps.innerHTML = STEPS.map((s, i) => {
    let cls = ''
    if (i === state.currentStep) cls = 'active'
    else if (i < state.currentStep) cls = 'done'
    return `<div class="progress-step ${cls}" onclick="goToStep(${i})">${s.label}</div>`
  }).join('')
  fill.style.width = `${(state.currentStep / (STEPS.length - 1)) * 100}%`
}

function goToStep(idx) {
  if (idx > state.currentStep) return // can't skip forward
  saveInputs()
  state.currentStep = idx
  renderStep(idx)
  window.scrollTo({ top: 0, behavior: 'smooth' })
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function nextStep() {
  saveInputs()
  hideAlert()
  if (!validateStep(state.currentStep)) return
  state.currentStep++
  renderStep(state.currentStep)
  window.scrollTo({ top: 0, behavior: 'smooth' })
}

function prevStep() {
  saveInputs()
  state.currentStep--
  renderStep(state.currentStep)
  window.scrollTo({ top: 0, behavior: 'smooth' })
}

// ─── Validation ───────────────────────────────────────────────────────────────
function validateStep(idx, opts = {}) {
  const d = state.data
  let ok = true
  const softLoWarn = opts.softLearningObjectiveWarn !== false

  function require(condition, msg) {
    if (!condition) { showAlert(msg); ok = false }
  }

  if (idx === 0) {
    if (!state.editId) {
      require(state.selectedFile, 'Please choose a file to upload.')
    }
    require(d.title?.trim(), 'Title is required.')
    require(d.module_id, 'Module ID is required.')
    require(d.lesson_id?.trim(), 'Lesson ID is required.')
    require(d.content_type, 'Content type is required.')
  }
  if (idx === 1) {
    require((d.disease_relevance_tags || []).length > 0, 'At least one disease relevance tag is required.')
    require(d.concept_domain, 'Concept domain is required.')
    require(d.primary_concept?.trim(), 'Primary concept is required.')
  }
  if (idx === 2) {
    if (d.can_stand_alone === false) {
      require((d.prerequisite_concept_ids || []).length > 0,
        'This asset cannot stand alone — please add at least one prerequisite asset.')
    }
    if (softLoWarn) {
      const obj = (d.learning_objective || '').trim()
      const startsWithVerb = obj && obj[0] === obj[0].toUpperCase()
      if (obj && !startsWithVerb) {
        showAlert("⚠️ Learning objectives should start with an action verb (e.g. 'Explain', 'Identify'). You can still continue.")
      }
    }
  }
  if (idx === 3) {
    require((d.target_audience || []).length > 0, 'At least one target audience is required.')
    require(d.health_literacy_level, 'Health literacy level is required.')
    require(d.medical_terminology_level, 'Medical terminology level is required.')
  }
  if (idx === 4) {
    require((d.stress_state_compatibility || []).length > 0, 'At least one stress state is required.')
    require((d.parent_expertise_stage || []).length > 0, 'At least one parent expertise stage is required.')
    require((d.care_journey_stage || []).length > 0, 'At least one care journey stage is required.')
  }
  if (idx === 6) {
    require((d.parent_question_patterns || []).length >= 2, 'Please add at least 2 parent question patterns.')
    require((d.keyword_triggers || []).length >= 3, 'Please add at least 3 keyword triggers.')
  }

  return ok
}

// ─── File handling ────────────────────────────────────────────────────────────
function handleFileSelect(input) {
  const file = input.files[0]
  if (!file) return
  state.selectedFile = file
  state.data.original_filename = file.name
  const chosen = el('fileChosen')
  chosen.textContent = '✓ ' + file.name
  chosen.classList.remove('hidden')
}

function handleTranscriptSelect(input) {
  const file = input.files[0]
  if (!file) return
  state.transcriptFile = file
  const chosen = el('transcriptChosen')
  chosen.textContent = '✓ ' + file.name
  chosen.classList.remove('hidden')
}

// ─── Submit (new asset — POST /upload) ───────────────────────────────────────
async function submitNewAsset() {
  saveInputs()
  hideAlert()

  for (let i = 0; i <= 7; i++) {
    if (!validateStep(i, { softLearningObjectiveWarn: false })) return
  }

  const d = state.data
  const load   = d.cognitive_load_rating
  const stress = d.stress_state_compatibility || []
  if (load === 'high' && stress.some(s => ['acute_crisis','post_bad_news'].includes(s))) {
    if (!confirm('⚠️ High cognitive load content is not recommended for acute crisis delivery. Submit anyway?')) return
  }

  const formData = new FormData()
  if (state.selectedFile)   formData.append('file', state.selectedFile)
  if (state.transcriptFile) formData.append('transcript', state.transcriptFile)

  Object.entries(d).forEach(([key, val]) => {
    if (val == null) return
    if (Array.isArray(val)) {
      val.forEach(v => formData.append(key + '[]', v))
    } else {
      formData.append(key, val)
    }
  })

  try {
    const res  = await fetch('/upload', { method: 'POST', body: formData })
    const json = await res.json()
    if (json.success) {
      renderSuccess(json.asset_id)
    } else {
      showAlert('Submission error: ' + json.error)
    }
  } catch (err) {
    showAlert('Network error: ' + err.message)
  }
}

// ─── Load existing assets for typeahead ──────────────────────────────────────
async function loadAssets() {
  try {
    const res  = await fetch('/assets')
    state.allAssets = await res.json()
  } catch(e) { console.warn('Could not load assets for typeahead', e) }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Set defaults
state.data.version              = 'v1.0'
state.data.language_versions    = ['en']
state.data.screen_reader_compatible = true
state.data.mobile_optimized     = true
state.data.can_stand_alone      = true
state.data.clinical_reviewed    = false
state.data.plain_language_version = false
state.data.includes_reassurance   = false
state.data.addresses_guilt_or_blame = false
state.data.decision_support_context = false
state.data.isolation_acknowledgment = false
state.data.audio_narration      = false
state.data.closed_captions      = false
state.data.generate_embeddings  = false

// ─── Edit mode: load existing asset into state ────────────────
async function loadEditAsset(id) {
  try {
    const res   = await fetch(`/assets/${id}`)
    const asset = await res.json()

    // Scalar fields
    const scalars = [
      'title','content_type','module_id','lesson_id','author_source','version',
      'concept_domain','primary_concept','explanation_role','sequence_position',
      'learning_objective','bloom_level','object_granularity','just_in_time_trigger',
      'health_literacy_level','medical_terminology_level','reading_level_grade',
      'modality_type','cognitive_load_rating','element_interactivity',
      'emotional_tone','emotional_sensitivity_level','intent_type','response_type',
      'alt_text','asset_id','original_filename'
    ]
    scalars.forEach(f => {
      if (asset[f] !== undefined && asset[f] !== null) state.data[f] = asset[f]
    })

    // Boolean fields
    const bools = [
      'clinical_reviewed','plain_language_version','can_stand_alone',
      'includes_reassurance','addresses_guilt_or_blame','decision_support_context',
      'isolation_acknowledgment','audio_narration','screen_reader_compatible',
      'mobile_optimized','closed_captions'
    ]
    bools.forEach(f => {
      if (asset[f] !== undefined && asset[f] !== null) state.data[f] = asset[f]
    })

    // Array fields
    const arrays = [
      'language_versions','disease_relevance_tags','secondary_concepts',
      'explains_symptom','explains_procedure','instructional_strategy',
      'target_audience','stress_state_compatibility','parent_expertise_stage',
      'care_journey_stage','appropriate_after_event','contraindicated_after_event',
      'parent_question_patterns','query_synonyms','keyword_triggers',
      'prerequisite_concept_ids','next_concept_ids'
    ]
    arrays.forEach(f => {
      if (Array.isArray(asset[f])) state.data[f] = asset[f]
    })

    state.editId = id
    return true
  } catch(e) {
    console.error('Failed to load asset for editing', e)
    return false
  }
}

// ─── Submit: new asset vs edit (PATCH) ───────────────────────
async function submitAsset() {
  if (!state.editId) {
    await submitNewAsset()
    return
  }

  saveInputs()
  hideAlert()

  const d = state.data
  const load   = d.cognitive_load_rating
  const stress = d.stress_state_compatibility || []
  if (load === 'high' && stress.some(s => ['acute_crisis','post_bad_news'].includes(s))) {
    if (!confirm('⚠️ High cognitive load content is not recommended for acute crisis delivery. Submit anyway?')) return
  }

  const formData = new FormData()
  if (state.selectedFile)   formData.append('file', state.selectedFile)
  if (state.transcriptFile) formData.append('transcript', state.transcriptFile)

  Object.entries(d).forEach(([key, val]) => {
    if (val == null) return
    if (Array.isArray(val)) {
      val.forEach(v => formData.append(key + '[]', v))
    } else {
      formData.append(key, val)
    }
  })

  try {
    const res  = await fetch(`/assets/${state.editId}`, { method: 'PATCH', body: formData })
    const json = await res.json()
    if (json.success) {
      el('stepsContainer').innerHTML = `
        <div class="card">
          <div class="success-screen">
            <div class="check">✅</div>
            <h2>Asset updated successfully</h2>
            <div class="asset-id-display">${json.asset.asset_id}</div>
            <p>Your changes have been saved to MongoDB.</p>
            <br>
            <div style="display:flex;gap:12px;justify-content:center">
              <button class="btn btn-primary" onclick="location.href='/admin/browse.html'">Back to browser</button>
              <button class="btn btn-secondary" onclick="location.reload()">Edit again</button>
            </div>
          </div>
        </div>`
    } else {
      showAlert('Update error: ' + json.error)
    }
  } catch(err) {
    showAlert('Network error: ' + err.message)
  }
}

// ─── Init ─────────────────────────────────────────────────────
// Set defaults for NEW assets only
const urlParams = new URLSearchParams(window.location.search)
const editId    = urlParams.get('edit')

if (editId) {
  // Edit mode — load asset first, then render
  state.editId = editId
  loadAssets().then(() => loadEditAsset(editId)).then(() => {
    renderStep(0)
    // Show edit mode banner
    document.querySelector('.app').insertAdjacentHTML('afterbegin', `
      <div style="background:#fffbeb;border:1px solid #f59e0b;border-radius:8px;
        padding:12px 16px;margin-bottom:20px;font-size:14px;color:#92400e;
        display:flex;justify-content:space-between;align-items:center">
        <span>✏️ <strong>Edit mode</strong> — you are editing an existing asset. All fields are pre-filled.</span>
        <a href="/admin/browse.html" style="color:#92400e;font-size:13px">Cancel → back to browser</a>
      </div>`)
  })
} else {
  // New asset mode — set defaults
  state.data.version                  = 'v1.0'
  state.data.language_versions        = ['en']
  state.data.screen_reader_compatible = true
  state.data.mobile_optimized         = true
  state.data.can_stand_alone          = true
  state.data.clinical_reviewed        = false
  state.data.plain_language_version   = false
  state.data.includes_reassurance     = false
  state.data.addresses_guilt_or_blame = false
  state.data.decision_support_context = false
  state.data.isolation_acknowledgment = false
  state.data.audio_narration          = false
  state.data.closed_captions          = false
  state.data.generate_embeddings      = false
  loadAssets()
  renderStep(0)
}
</script>
