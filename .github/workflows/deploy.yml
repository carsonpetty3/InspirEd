# Checks every PR and push to main, then deploys to Vercel:
#   pull request  -> preview deployment (URL shown as "View deployment" on the PR)
#   push to main  -> production deployment
# Deploying from Actions (instead of Vercel's Git integration) lets every teammate's
# commits deploy on the Hobby plan. Needs repo secrets VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID — see docs/deployment.md.
name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (non-blocking until existing formatting errors are cleaned up)
        run: npx expo lint
        continue-on-error: true
      - name: Build web
        run: npx expo export -p web
      - name: Make sure no secrets are in the web bundle
        run: |
          if grep -rEl "AIza[0-9A-Za-z_-]{35}|BEGIN PRIVATE KEY-----(\\\\n|\s)*[A-Za-z0-9+/]{40}" dist/; then
            echo "::error::A Google API key or private key ended up in the web bundle"
            exit 1
          fi
      - name: Server loads
        run: |
          npm ci --prefix asset-admin
          node -e "require('./asset-admin/app')"

  deploy:
    needs: check
    # Fork PRs don't get repo secrets, so they can't deploy.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
